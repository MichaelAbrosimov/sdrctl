# sdrctl configuration. Copy to /etc/sdrctl/config.yaml and adjust.
#
# Runtime state lives in systemd, not here and not in any state file:
#   actual mode  = which SDR unit is active
#   desired mode = which SDR unit is enabled

node:
  id: wyse-sdr-01
  role: rtl-sdr-backend

api:
  enabled: true
  listen: "0.0.0.0:8081"
  # Write endpoints (POST /mode/..., POST /devices/<id>/mode/...) stay off
  # until BOTH write_enabled is true and a token is set. Read API is always
  # available while api.enabled is true.
  write_enabled: false
  # Put the token into /etc/sdrctl/secrets.yaml (0600 root:root, see
  # configs/secrets.example.yaml), NOT here: this file must stay readable
  # for the operator CLI. The agent refuses to start when an ACTIVE secret
  # sits in a file readable beyond its owner.
  token: ""

# Local control socket — the CLI's primary channel. Always served while the
# agent runs; read AND write, no token: access control is the socket file
# (root:<group> 0660). Create the group once on the node:
#   groupadd sdrctl && usermod -aG sdrctl <operator>
socket:
  path: /run/sdrctl/sdrctl.sock
  group: sdrctl

mqtt:
  enabled: false
  broker: "tcp://192.168.0.10:1883"
  # Defaults: client_id = sdrctl-<node id>, topic_prefix = sdr/<node id>
  client_id: ""
  topic_prefix: ""
  username: ""
  password: ""
  qos: 1
  retain: true
  heartbeat_sec: 0   # 0 = publish on state change only

observer:
  interval_sec: 5
  # Restart a service that is enabled (desired) but inactive/failed while its
  # dongle is present — recovers after a re-plug once systemd's StartLimit
  # has been exhausted. The agent never fights systemd: attempts are limited
  # to one per device per restore_cooldown_sec.
  auto_restore: true
  restore_cooldown_sec: 30

# How long one mode transition may take (disable competitors, enable target,
# verify). Applies to the agent's executors and to the CLI fallback; the CLI
# socket client waits this long plus a small margin.
mode_set_timeout_sec: 15

# --- Single-device form ------------------------------------------------------
# With one dongle a top-level services block is enough; sdrctl turns it into
# one implicit default device "rtl-sdr-01". Service keys are the mode names.

services:
  # Mode names may be plain units or template instances. An instance name is
  # an opaque PROFILE id: rtl-433@868 means "whatever
  # /etc/sdrctl/profiles/rtl-433/868.env says". Adding a frequency is then one
  # env file plus one line here — no unit editing on the node, and the desired
  # state still lives entirely in systemd's `enabled`.
  rtl-tcp:
    systemd: rtl-tcp.service
    port: 1234
  rtl-433@433:
    systemd: rtl-433@433.service
    optional: true
  rtl-433@868:
    systemd: rtl-433@868.service
    optional: true
  spyserver:
    systemd: spyserver.service
    optional: true

# Beware the shorthand: with both instances configured, `sdrctl mode rtl-433`
# is AMBIGUOUS and is refused with both candidates listed, while `sdrctl mode
# 868` resolves. That is deliberate — a half-named mode would hide which
# frequency the node actually went to.

# --- Multi-device form -------------------------------------------------------
# Remove the services block above and describe each dongle explicitly.
# RTL-SDR Blog V4 dongles all ship with serial 00000001 — assign unique
# serials with rtl_eeprom BEFORE configuring several of them (see
# docs/install-wyse-sdr-01.md).
#
# devices:
#   - id: rtl-sdr-01
#     type: rtl-sdr            # implies usb ids 0bda:2838
#     label: "RTL-SDR Blog V4 main"
#     serial: "00000001"
#     default: true
#     services:
#       rtl-tcp:
#         systemd: "rtl-tcp@main.service"      # profile pins -d in its env
#         port: 1234
#   - id: rtl-sdr-02
#     type: rtl-sdr
#     label: "RTL-SDR secondary"
#     serial: "00000002"
#     optional: true           # missing optional device never breaks global health
#     services:
#       rtl-tcp:
#         systemd: "rtl-tcp@second.service"    # its env pins the other dongle
#         port: 1235
#       rtl-433@868:
#         systemd: "rtl-433@868-second.service"
#         optional: true
#
# Device selection is a PROFILE parameter (DEVICE_ARGS=-d <index>), not a
# second instance axis: one meaning of %i everywhere keeps unit names and
# drop-ins predictable.
