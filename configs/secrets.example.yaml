# Agent-only secrets overlay. Install NEXT TO the main config:
#   install -m 0600 -o root -g root configs/secrets.example.yaml /etc/sdrctl/secrets.yaml
#
# Only `sdrctl agent` (running as root) reads this file; the operator-
# readable /etc/sdrctl/config.yaml must not carry secrets. The agent
# REFUSES to start if a file supplying an active secret is readable beyond
# its owner.

api:
  token: ""          # bearer token of the network write API

mqtt:
  username: ""
  password: ""
